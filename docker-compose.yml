# Local development stack. The database password below is a local-only default for a
# container bound to 127.0.0.1; do not reuse it anywhere else.
#
#   docker compose up -d db                 # database only (run backend/frontend natively)
#   docker compose --profile app up --build # database + backend + frontend
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carebridge
      POSTGRES_PASSWORD: carebridge
      POSTGRES_DB: carebridge
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - carebridge_pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carebridge -d carebridge"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    profiles: ["app"]
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://carebridge:carebridge@db:5432/carebridge
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Copy .env.example to .env and set JWT_SECRET_KEY}
      CORS_ORIGINS: http://localhost:5173
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SPEECH_PROVIDER: ${SPEECH_PROVIDER:-none}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}
    ports:
           - "127.0.0.1:5433:5432"

  frontend:
    profiles: ["app"]
    build: ./frontend
    depends_on:
      - backend
    environment:
      VITE_DEV_BACKEND: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"

volumes:
  carebridge_pgdata:
